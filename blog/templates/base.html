{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            InkFlow
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

     {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-container">

            <a href="home.html" class="logo">
                InkFlow
            </a>

            <nav>
                <a href="home.html">Home</a>
                <a href="#">Explore</a>
                <a href="#">My Posts</a>
                <a href="login.html">Login</a>

                <a href="{% url "create_post" %}" class="write-btn">
                    Write
                </a>
            </nav>

        </div>
    </header>



    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


     <!-- Footer -->
    <footer>

        <div class="container footer-content">

            <div>
                <h3>InkFlow</h3>

                <p>
                    A place for ideas, stories and experiences.
                </p>
            </div>

            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Privacy</a>
                <a href="#">Contact</a>
            </div>

        </div>

        <div class="copyright">
            © 2026 InkFlow. All rights reserved.
        </div>

    </footer>


    <script src="{% static 'script.js' %}"></script>

</body>

</html>
