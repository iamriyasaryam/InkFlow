{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Create New Post</h1>

        <form method="POST">

            {% csrf_token %}

            <div>
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                >
            </div>

            <br>

            <div>
                <label for="author">Author</label>
                <input
                    type="text"
                    id="author"
                    name="author"
                    required
                >
            </div>

            <br>

            <div>
                <label for="content">Content</label>
                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    required
                ></textarea>
            </div>

            <br>

            <button type="submit">Publish Post</button>

        </form>

    </div>

</body>
</html>
