{% extends "base.html" %}
{% load static %}

      {% block title %}
            Home
        {% endblock %}

    {% block content %}

    <div class="container">

        <h1>Delete Post</h1>

        <p>
            Are you sure you want to delete
            "<strong>{{ post.title }}</strong>"?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Yes, Delete
            </button>

            <a href="{% url 'post_detail' post.id %}">
                Cancel
            </a>

        </form>

    </div>

    {% endblock %}
