{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Post</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Edit Post</h1>

        <form method="POST">

            {% csrf_token %}

            <div>
                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ post.title }}"
                    required
                >
            </div>

            <div>
                <label for="author">Author</label>

                <input
                    type="text"
                    id="author"
                    name="author"
                    value="{{ post.author }}"
                    required
                >
            </div>

            <div>
                <label for="content">Content</label>

                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    required
                >{{ post.content }}</textarea>
            </div>

            <button type="submit">
                Update Post
            </button>

        </form>

    </div>

</body>
</html>
